name: ULGURJI syntax check
on:
  push:
    paths:
      - 'ULGURJI_ONLINE_NAZORAT/**'
      - '.github/workflows/ulgurji-check.yml'
  pull_request:
    paths:
      - 'ULGURJI_ONLINE_NAZORAT/**'
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ULGURJI_ONLINE_NAZORAT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
