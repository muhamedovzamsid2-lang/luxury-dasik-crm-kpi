<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ходим панели — УЛГУРЖИ ОНЛАЙН НАЗОРАТ</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000a}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#172033;color:white}button.alt{background:#eef2f7;color:#172033}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:#f7f9fc;border-radius:12px}.muted{color:#667085}.consumer{display:flex;justify-content:space-between;gap:12px;align-items:center}.danger{color:#b42318}.ok{color:#067647}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.consumer{display:block}.consumer button{margin-top:8px;width:100%}}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dce5;border-radius:10px;margin:6px 0 10px}label{font-weight:700;font-size:14px}.hidden{display:none}</style></head><body><main class="wrap"><header class="card"><div class="muted">УЛГУРЖИ ОНЛАЙН НАЗОРАТ</div><h1 id="name">Ходим панели</h1><div id="meta" class="muted"></div><div id="gps" class="danger">GPS текширилмоқда...</div><button id="logout" class="alt">Чиқиш</button></header><section class="grid"><div class="stat">Режа<br><b id="plan">0</b></div><div class="stat">Ташриф<br><b id="visited">0</b></div><div class="stat">Ташрифсиз<br><b id="pending">0</b></div><div class="stat">Бажарилиш<br><b id="percent">0%</b></div></section><section class="card"><h2>Бугунги истеъмолчилар</h2><input id="search" placeholder="Истеъмолчини қидириш..."><div id="list">Юкланмоқда...</div></section><section id="visit" class="card hidden"><h2 id="vtitle">Ташриф</h2><div id="vstatus" class="muted"></div><button id="start">Ташрифни бошлаш</button><button id="saveLoc" class="alt">Локацияни сақлаш</button><button id="finish" class="hidden">Ташрифни якунлаш</button><div id="form" class="hidden"><label>Натижа</label><select id="outcome"><option value="">Танланг</option><option>Бажарилди</option><option>Қисман бажарилди</option><option>Бажарилмади</option></select><label>Изоҳ</label><textarea id="notes"></textarea><button id="submit">Сақлаш</button></div></section></main><script>(async()=>{const token=localStorage.getItem('ulgurji_token');if(!token){location.href='/';return}const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};let me,items=[],selected=null,watch=null;const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})}});if(r.status===401){localStorage.removeItem('ulgurji_token');location.href='/';throw Error('AUTH')}if(!r.ok)throw Error(await r.text());return r.json()}function render(){const q=$('search').value.trim().toLowerCase();const rows=items.filter(x=>!q||[x.name,x.branch,x.district,x.mahalla,x.street,x.phone].join(' ').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(x=>`<div class="card consumer"><div><b>${esc(x.name||'Номсиз')}</b><div class="muted">${esc([x.region||x.branch,x.district,x.mahalla,x.street].filter(Boolean).join(' • '))}</div><div>${x.visit_id?'<span class="ok">Ташриф қилинган</span>':'<span class="danger">Ташриф кутилмоқда</span>'}</div></div><button data-id="${x.id}">Кириш</button></div>`).join(''):'<p class="muted">Бугунги режада сизга бириктирилган истеъмолчи йўқ.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(+b.dataset.id))}function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}async function load(){me=await api('/api/me');$('name').textContent=me.name||'Ходим';$('meta').textContent=[me.region,me.district,me.position].filter(Boolean).join(' • ');const r=await api('/api/today');items=r.items||[];$('plan').textContent=items.length;$('visited').textContent=items.filter(x=>x.visit_id).length;$('pending').textContent=Math.max(0,items.length-$('visited').textContent);$('percent').textContent=items.length?Math.round(items.filter(x=>x.visit_id).length*100/items.length)+'%':'0%';render()}function gps(){if(!navigator.geolocation){$('gps').textContent='GPS мавжуд эмас';return}navigator.geolocation.getCurrentPosition(p=>{$('gps').textContent=`GPS тайёр • ±${Math.round(p.coords.accuracy||0)} м`},()=>{$('gps').textContent='GPS рад этилди — браузерда Location рухсатини ёқинг'}, {enableHighAccuracy:true,timeout:10000,maximumAge:30000});watch=navigator.geolocation.watchPosition(p=>fetch('/api/gps',{method:'POST',headers:H,body:JSON.stringify({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy,speed:p.coords.speed,client_event_id:crypto.randomUUID()})}).catch(()=>{}),()=>{}, {enableHighAccuracy:true,maximumAge:10000,timeout:15000})}async function open(id){selected=items.find(x=>x.id===id);$('visit').classList.remove('hidden');$('vtitle').textContent=selected.name;$('vstatus').textContent=selected.visit_id?'Ташриф бошланган/якунланган':'Ташриф бошланмаган';$('start').classList.toggle('hidden',!!selected.visit_id);$('finish').classList.add('hidden');$('form').classList.add('hidden');$('visit').scrollIntoView({behavior:'smooth'})}function pos(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:15000,maximumAge:0}))}$('start').onclick=async()=>{try{const c=await pos();await api('/api/visits/start',{method:'POST',body:JSON.stringify({consumer_id:selected.id,lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,client_event_id:crypto.randomUUID()})});await load();selected=items.find(x=>x.id===selected.id);$('finish').classList.remove('hidden');$('start').classList.add('hidden')}catch(e){alert('Ташрифни бошлаб бўлмади: '+e.message)}};$('saveLoc').onclick=async()=>{try{const c=await pos();await api('/api/consumers/location',{method:'POST',body:JSON.stringify({consumer_id:selected.id,lat:c.latitude,lon:c.longitude,accuracy:c.accuracy})});alert('Локация сақланди')}catch(e){alert('Локация сақланмади: '+e.message)}};$('finish').onclick=()=>{$('finish').classList.add('hidden');$('form').classList.remove('hidden')};$('submit').onclick=async()=>{if(!$('outcome').value)return alert('Натижани танланг');try{const c=await pos();await api('/api/visits/finish',{method:'POST',body:JSON.stringify({consumer_id:selected.id,lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,client_event_id:crypto.randomUUID(),outcome:$('outcome').value,notes:$('notes').value})});alert('Ташриф сақланди');$('visit').classList.add('hidden');await load()}catch(e){alert('Сақлашда хато: '+e.message)}};$('search').oninput=render;$('logout').onclick=()=>{if(watch)navigator.geolocation.clearWatch(watch);localStorage.removeItem('ulgurji_token');location.href='/'};try{await load();gps()}catch(e){if(e.message!=='AUTH')$('list').innerHTML='<p class="danger">Маълумотни юклашда хато. Саҳифани янгиланг.</p>'}})()</script></body></html>
