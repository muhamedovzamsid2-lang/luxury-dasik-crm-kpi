<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ходим панели</title><style>body{margin:0;background:#f4f6fa;color:#182230;font:15px system-ui}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:12px;background:#f7f9fc;border-radius:11px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5dbe5;border-radius:9px;margin:5px 0 10px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:#182230;color:#fff;margin:3px}button.alt{background:#eef1f5;color:#182230}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.item{border:1px solid #e1e6ed;border-radius:11px;padding:12px;margin:8px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#667085}.ok{color:#067647}.bad{color:#b42318}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.row{display:block}}</style></head><body><main class="wrap"><header class="card"><div class="muted">УЛГУРЖИ ОНЛАЙН НАЗОРАТ</div><h1 id="emp">Ходим панели</h1><div id="meta" class="muted"></div><div id="gps" class="bad">GPS текширилмоқда...</div><button id="logout" class="alt">Чиқиш</button></header><section class="grid"><div class="stat">Режа<br><b id="plan">0</b></div><div class="stat">Ташриф<br><b id="vis">0</b></div><div class="stat">Қолдиқ<br><b id="left">0</b></div><div class="stat">Бажарилиш<br><b id="pct">0%</b></div></section><section class="card"><h2>Бугунги истеъмолчилар</h2><input id="search" placeholder="Номи, ҳудуд, туман, кўча бўйича қидириш"><div id="list">Юкланмоқда...</div></section><section id="work" class="card hidden"><div class="row"><div><h2 id="ctitle"></h2><div id="caddr" class="muted"></div></div><button id="close" class="alt">Ёпиш</button></div><div id="vstate" class="muted"></div><div><button id="start">Ташрифни бошлаш</button><button id="loc" class="alt">Локацияни сақлаш</button><button id="finish" class="hidden">Ташрифни якунлаш</button></div><div id="entry" class="hidden"><h3>Маълумот киритиш</h3><div class="two"><div><label>Истеъмолчи</label><input id="consumer" readonly></div><div><label>Олдиндан тўлов / дебитор қарздорлик</label><input id="debt"></div><div><label>Тўлов → сумма</label><input id="payment" type="number" step="0.01"></div><div><label>Ҳисоблагичлар сони</label><input id="meters" type="number" min="0"></div><div><label>Ҳисоблагич тури/номи</label><input id="meterType"></div><div><label>Тамға серия/рақами</label><input id="sealNo"></div><div><label>Соз/носоз</label><select id="meterState"><option>Соз</option><option>Носоз</option></select></div><div><label>Газ жиҳозлари сони</label><input id="gasCount" type="number" min="0"></div><div><label>Газ жиҳозлари турлари</label><input id="gasTypes"></div><div><label>Стандарт/ностандарт</label><select id="standard"><option>Стандарт</option><option>Ностандарт</option></select></div><div><label>ГОСТ муддати</label><input id="gost"></div><div><label>Корхона фаол/фаол эмас</label><select id="active"><option value="1">Фаол</option><option value="0">Фаол эмас</option></select></div><div><label>Натижа *</label><select id="outcome"><option value="">Танланг</option><option>Бажарилди</option><option>Қисман бажарилди</option><option>Бажарилмади</option></select></div></div><div id="inactive" class="hidden"><label>Тармоқдан учирилганлик фотоси *</label><input id="offPhoto" type="file" accept="image/*"><label>Далолатнома *</label><input id="act" type="file" accept="image/*,.pdf"></div><label>Изоҳ</label><textarea id="notes" rows="3"></textarea><h3>Мажбурий фотолар</h3><div class="two"><div><label>Тамға фотоси *</label><input id="sealPhoto" type="file" accept="image/*"></div><div><label>Ҳисоблагич фотоси *</label><input id="meterPhoto" type="file" accept="image/*"></div><div><label>Кўрсаткич фотоси *</label><input id="readingPhoto" type="file" accept="image/*"></div><div><label>Газ жиҳозлари фотолари *</label><input id="gasPhoto" type="file" accept="image/*" multiple></div></div><label>Қўшимча файл</label><input id="extra" type="file"><div><button id="save" class="alt">Сақлаш</button><button id="send">Раҳбарга юбориш</button><button id="clear" class="alt">Тозалаш</button></div><div id="msg" class="muted"></div></div></section></main><script>(async()=>{const token=localStorage.getItem('ulgurji_token');if(!token){location.href='/';return}const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};let items=[],selected=null,watch=null;const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})},cache:'no-store'});if(r.status===401){localStorage.removeItem('ulgurji_token');location.href='/';throw Error('AUTH')}if(!r.ok){throw Error((await r.text())||('HTTP '+r.status))}return r.status===204?{}:r.json()}function esc(x){return String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]) )}function pos(){return new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:15000,maximumAge:0}))}async function load(){const me=await api('/api/me');if(me.role!=='employee'){location.href='/';return}$('emp').textContent=me.name||'Ходим';$('meta').textContent=[me.region,me.district,me.position].filter(Boolean).join(' • ');const r=await api('/api/today');items=r.items||[];const done=items.filter(x=>x.ended_server||x.visit_status==='FINISHED').length;$('plan').textContent=items.length;$('vis').textContent=done;$('left').textContent=Math.max(0,items.length-done);$('pct').textContent=items.length?Math.round(done*100/items.length)+'%':'0%';render()}function render(){const q=$('search').value.trim().toLowerCase(),a=items.filter(x=>!q||[x.name,x.branch,x.region,x.district,x.mahalla,x.street,x.phone].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.name||'Номсиз')}</b><div class="muted">${esc([x.region||x.branch,x.district,x.mahalla,x.street].filter(Boolean).join(' • '))}</div><div class="${x.ended_server?'ok':'bad'}">${x.ended_server?'Ташриф якунланган':x.started_server?'Ташриф бошланган':'Ташриф кутилмоқда'}</div><button data-id="${x.id}">Ишни очиш</button></div>`).join(''):'<p class="muted">Бугунги режада сизга бириктирилган истеъмолчи йўқ.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(+b.dataset.id))}function open(id){selected=items.find(x=>x.id===id);if(!selected)return;$('work').classList.remove('hidden');$('ctitle').textContent=selected.name||'Истеъмолчи';$('consumer').value=selected.name||'';$('caddr').textContent=[selected.region||selected.branch,selected.district,selected.mahalla,selected.street].filter(Boolean).join(' • ');$('vstate').textContent=selected.ended_server?'Ташриф якунланган':selected.started_server?'Ташриф бошланган':'Ташриф бошланмаган';$('start').classList.toggle('hidden',!!selected.started_server);$('finish').classList.toggle('hidden',!selected.started_server||!!selected.ended_server);$('entry').classList.toggle('hidden',!selected.ended_server);$('work').scrollIntoView({behavior:'smooth'})}async function startVisit(){try{const c=await pos();await api('/api/visits/start',{method:'POST',body:JSON.stringify({consumer_id:selected.id,lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,client_event_id:crypto.randomUUID()})});const id=selected.id;await load();open(id)}catch(e){alert('Ташрифни бошлаб бўлмади: '+e.message)}}async function finishVisit(){try{const c=await pos();await api('/api/employee-visit-finish',{method:'POST',body:JSON.stringify({consumer_id:selected.id,lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,outcome:$('outcome').value||'Бажарилди',notes:$('notes').value,client_event_id:crypto.randomUUID()})});const id=selected.id;await load();open(id);$('entry').classList.remove('hidden');$('entry').scrollIntoView({behavior:'smooth'})}catch(e){alert('Ташрифни якунлаб бўлмади: '+e.message)}}async function saveLocation(){try{const c=await pos();await api('/api/consumers/location',{method:'POST',body:JSON.stringify({consumer_id:selected.id,lat:c.latitude,lon:c.longitude,accuracy:c.accuracy})});alert('Локация раҳбар тасдиғи учун сақланди')}catch(e){alert('Локация сақланмади: '+e.message)}}function fw(){return {prepayment_debt:$('debt').value,payment_amount:$('payment').value,meter_count:$('meters').value,meter_type:$('meterType').value,seal_serial:$('sealNo').value,meter_condition:$('meterState').value,gas_equipment_count:$('gasCount').value,gas_equipment_types:$('gasTypes').value,standard_status:$('standard').value,gost_deadline:$('gost').value,company_active:$('active').value,outcome:$('outcome').value,notes:$('notes').value,network_removed:$('active').value==='0'}}async function fd(input){const f=input.files[0];if(!f)return null;return {name:f.name,type:f.type,data:await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}}async function files(){const a=[];for(const [id,role] of [['sealPhoto','seal'],['meterPhoto','meter'],['readingPhoto','reading'],['offPhoto','network_removed'],['act','act'],['extra','extra']]){const x=await fd($(id));if(x){x.role=role;a.push(x)}}for(const f of [...$('gasPhoto').files])a.push({name:f.name,type:f.type,role:'gas',data:await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})});return a}function required(status){if(status!=='SUBMITTED')return '';if(!$('outcome').value)return 'Натижани танланг';for(const id of ['sealPhoto','meterPhoto','readingPhoto','gasPhoto'])if(!$(id).files.length)return 'Барча мажбурий фотоларни бириктиринг';if($('active').value==='0'&&(!$('offPhoto').files.length||!$('act').files.length))return 'Фаол эмас корхона учун тармоқ фотоси ва далолатнома мажбурий';return ''}async function submit(status){const er=required(status);if(er){alert(er);return}try{const c=await pos(),f=await files();await api('/api/employee-entry',{method:'POST',body:JSON.stringify({consumer_id:selected.id,status,lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,fieldwork:fw(),notes:$('notes').value,attachments:f})});$('msg').textContent=status==='SUBMITTED'?'Раҳбарга юборилди':'Қоралама сақланди';if(status==='SUBMITTED'){alert('Маълумот раҳбарга юборилди');await load();open(selected.id)}}catch(e){alert('Сақлашда хато: '+e.message)}}$('active').onchange=()=>$('inactive').classList.toggle('hidden',$('active').value!=='0');$('start').onclick=startVisit;$('finish').onclick=finishVisit;$('loc').onclick=saveLocation;$('save').onclick=()=>submit('DRAFT');$('send').onclick=()=>submit('SUBMITTED');$('clear').onclick=()=>document.querySelectorAll('#entry input,#entry textarea,#entry select').forEach(x=>{if(x.type==='file')x.value='';else if(x.tagName==='SELECT')x.selectedIndex=0;else if(!x.readOnly)x.value=''});$('close').onclick=()=>$('work').classList.add('hidden');$('search').oninput=render;$('logout').onclick=()=>{if(watch)navigator.geolocation.clearWatch(watch);localStorage.removeItem('ulgurji_token');location.href='/'};try{await load();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>$('gps').textContent='GPS тайёр • ±'+Math.round(p.coords.accuracy||0)+' м',()=>$('gps').textContent='GPS рухсати берилмаган',{enableHighAccuracy:true,timeout:10000,maximumAge:10000})}catch(e){if(e.message!=='AUTH')$('list').innerHTML='<p class="bad">Маълумотни юклашда хато.</p>'}})()</script></body></html>
