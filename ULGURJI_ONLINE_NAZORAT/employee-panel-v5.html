<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>УЛГУРЖИ ОНЛАЙН НАЗОРАТ — Ходим панели</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#e8eef8;color:#172033}.danger{background:#d92d20}.success{background:#039855}.wrap{max-width:1100px;margin:auto;padding:14px}.top{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:15px;margin-bottom:12px}.brand{font-weight:900;font-size:20px}.sub{color:#667085;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{background:#fff;border:1px solid #e5eaf2;border-radius:14px;padding:13px}.stat b{font-size:25px;display:block;margin-top:4px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:15px;margin-bottom:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.field,textarea,select{border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;background:#fff;min-width:0}.field{width:100%}textarea{width:100%;min-height:90px;resize:vertical}.consumer{padding:13px;border:1px solid #e5eaf2;border-radius:13px;margin-top:8px}.consumer.selected{border:2px solid #1769e0}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef4ff;color:#175cd3;font-size:12px;font-weight:800}.ok{background:#ecfdf3;color:#027a48}.warn{background:#fffaeb;color:#b54708}.err{background:#fef3f2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.label{font-size:12px;font-weight:800;color:#475467;margin:10px 0 5px}.file{border:1px dashed #98a2b3;border-radius:11px;padding:12px;width:100%;background:#f8fafc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{padding:11px;border-radius:10px;background:#f2f4f7;margin:9px 0}.hidden{display:none!important}.gps{font-weight:800}.msg{padding:11px;border-radius:10px;margin-top:10px}.modal{position:fixed;inset:0;background:#10182888;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{background:#fff;border-radius:17px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:18px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.actions button{flex:1;min-width:130px}}
</style></head><body><div class="wrap" id="app"></div><script>
(()=>{const $=s=>document.querySelector(s),token=localStorage.getItem('ulgurji_token')||localStorage.getItem('uog_token');if(!token){location.replace('/');return}const api=async(path,opt={})=>{const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const S={me:null,items:[],selected:null,visit:null,gps:null,entryId:null};function gps(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Браузер GPS ни қўлламайди'));navigator.geolocation.getCurrentPosition(p=>{S.gps={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};ok(S.gps)},e=>no(new Error(e.code===1?'GPS учун рухсат берилмади':e.message)),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}async function boot(){try{S.me=await api('/api/me');if(S.me.role!=='employee'){location.replace('/manager-panel-v1.html');return}render();await load()}catch(e){localStorage.removeItem('ulgurji_token');localStorage.removeItem('uog_token');location.replace('/')}}function render(){document.body.innerHTML='<div class="wrap"><div class="top"><div class="row" style="justify-content:space-between"><div><div class="brand">УЛГУРЖИ ОНЛАЙН НАЗОРАТ</div><div class="sub">Ходим: <b>'+esc(S.me.name||S.me.employee_name||S.me.login)+'</b> • '+esc(S.me.region)+' • '+esc(S.me.district)+'</div></div><button id="logout" class="danger">Чиқиш</button></div><div class="notice gps" id="gps">GPS: текширилмоқда...</div></div><div class="stats"><div class="stat">Бугунги режа<b id="planned">0</b></div><div class="stat">Ташриф<b id="visited">0</b></div><div class="stat">Қолдиқ<b id="left">0</b></div><div class="stat">Бажарилиш<b id="pct">0%</b></div></div><div class="card"><div class="row"><input id="search" class="field grow" placeholder="Истеъмолчини қидириш..."><button id="refresh" class="secondary">Янгилаш</button></div><div id="list"></div></div><div id="work" class="hidden"></div><div class="card" style="text-align:center;color:#667085">Истеъмолчини танланг. Ходим фақат ўзига берилган бугунги режани кўради.</div></div>';$('#logout').onclick=()=>{localStorage.removeItem('ulgurji_token');localStorage.removeItem('uog_token');location.replace('/')};$('#search').oninput=()=>drawList();$('#refresh').onclick=load}async function load(){try{await gps().then(x=>{$('#gps').textContent='GPS: тайёр • аниқлик '+Math.round(x.accuracy)+' м';$('#gps').className='notice gps ok'}).catch(e=>{$('#gps').textContent='GPS: '+e.message;$('#gps').className='notice gps err'});const d=await api('/api/today');S.items=d.rows||d.result||[];updateStats();drawList()}catch(e){$('#list').innerHTML='<div class="msg err">Маълумотни юклашда хато: '+esc(e.message)+'</div>'}}function updateStats(){const planned=S.items.length,visited=S.items.filter(x=>x.ended_server||x.visit_status==='FINISHED').length;$('#planned').textContent=planned;$('#visited').textContent=visited;$('#left').textContent=Math.max(0,planned-visited);$('#pct').textContent=(planned?Math.round(visited/planned*100):0)+'%'}function drawList(){const q=($('#search')?.value||'').toLowerCase();const a=S.items.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#list').innerHTML=a.length?a.map(x=>{const id=x.consumer_id||x.id,done=!!(x.ended_server||x.visit_status==='FINISHED');return '<div class="consumer '+(S.selected&&String(S.selected.consumer_id||S.selected.id)===String(id)?'selected':'')+'"><div class="row" style="justify-content:space-between"><div><b>'+esc(x.name||x.consumer_name||id)+'</b><div class="sub">'+esc(x.address||[x.region,x.district,x.mahalla,x.street].filter(Boolean).join(' • '))+'</div></div><span class="badge '+(done?'ok':'warn')+'">'+(done?'Якунланган':'Режада')+'</span></div><div class="actions"><button data-open="'+esc(id)+'">Ишни очиш</button></div></div>'}).join(''):'<div class="notice">Бугунги режада истеъмолчи йўқ.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>select(b.dataset.open))}function select(id){S.selected=S.items.find(x=>String(x.consumer_id||x.id)===String(id));S.visit=null;S.entryId=null;drawList();drawWork()}function drawWork(){const w=$('#work');if(!S.selected){w.classList.add('hidden');return}w.classList.remove('hidden');const x=S.selected,id=x.consumer_id||x.id,done=!!(x.ended_server||x.visit_status==='FINISHED');w.innerHTML='<div class="card"><h2 style="margin-top:0">'+esc(x.name||x.consumer_name||id)+'</h2><div class="sub">'+esc(x.address||'')+'</div><div class="row" style="margin-top:12px"><span class="badge '+(done?'ok':'warn')+'">'+(done?'Ташриф якунланган':'Ташриф очиқ')+'</span><span class="badge">GPS геозона: 150 м</span></div><div class="actions">'+(!done?'<button id="start">Ташрифни бошлаш</button><button id="loc" class="secondary">Локацияни сақлаш</button>':'')+'<button id="entry" class="secondary">Маълумот киритиш</button></div><div id="form" class="hidden"></div></div>';if($('#start'))$('#start').onclick=startVisit;if($('#loc'))$('#loc').onclick=saveLoc;$('#entry').onclick=()=>{S.entryId=null;drawForm()}}async function saveLoc(){try{const g=await gps();S.gps=g;await api('/api/consumers/location',{method:'POST',body:JSON.stringify({consumer_id:+(S.selected.consumer_id||S.selected.id),lat:g.lat,lon:g.lon,accuracy:g.accuracy})});alert('Локация раҳбар тасдиғи учун сақланди.')}catch(e){alert(e.message)}}async function startVisit(){try{const g=await gps();S.gps=g;const r=await api('/api/visits/start',{method:'POST',body:JSON.stringify({consumer_id:+(S.selected.consumer_id||S.selected.id),lat:g.lat,lon:g.lon,accuracy:g.accuracy,client_event_id:crypto.randomUUID()})});S.visit=r;alert('Ташриф бошланди');await load();select(S.selected.consumer_id||S.selected.id)}catch(e){alert('Ташриф бошланмади: '+e.message)}}function drawForm(){const f=$('#form');f.classList.remove('hidden');f.innerHTML='<h3>Маълумот киритиш</h3><div class="grid"><div><div class="label">Алоқа шахси</div><input id="contact" class="field"></div><div><div class="label">Олдиндан тўлов / дебитор қарздорлик</div><input id="debt" class="field"></div><div><div class="label">Тўлов → сумма</div><input id="payment" class="field"></div><div><div class="label">Ҳисоблагичлар сони</div><input id="meterCount" type="number" min="0" class="field"></div><div><div class="label">Ҳисоблагич тури/номи</div><input id="meterType" class="field"></div><div><div class="label">Тамға серия/рақами</div><input id="sealNo" class="field"></div><div><div class="label">Ҳисоблагич ҳолати</div><select id="meterState" class="field"><option>Соз</option><option>Носоз</option></select></div><div><div class="label">Газ жиҳозлари сони ва турлари</div><input id="gasType" class="field"></div><div><div class="label">Стандарт / ностандарт</div><select id="standard" class="field"><option>Стандарт</option><option>Ностандарт</option></select></div><div><div class="label">ГОСТ муддати</div><input id="gost" type="date" class="field"></div><div><div class="label">Корхона ҳолати</div><select id="active" class="field"><option value="1">Фаол</option><option value="0">Фаол эмас</option></select></div></div><div class="label">Натижа *</div><select id="outcome" class="field"><option value="">Танланг</option><option>Бажарилди</option><option>Қисман бажарилди</option><option>Муаммо аниқланди</option><option>Тўлов қилинди</option><option>Қайта ташриф керак</option></select><div class="label">Изоҳ</div><textarea id="notes"></textarea><div class="grid"><div><div class="label">Тамға фотоси *</div><input id="sealPhoto" class="file" type="file" accept="image/*" capture="environment"></div><div><div class="label">Ҳисоблагич фотоси *</div><input id="meterPhoto" class="file" type="file" accept="image/*" capture="environment"></div><div><div class="label">Кўрсаткич фотоси *</div><input id="readingPhoto" class="file" type="file" accept="image/*" capture="environment"></div><div><div class="label">Газ жиҳозлари фотолари *</div><input id="gasPhoto" class="file" type="file" accept="image/*" multiple capture="environment"></div><div><div class="label">Тармоқдан учирилганлик фотоси <span id="netReq"></span></div><input id="netPhoto" class="file" type="file" accept="image/*" capture="environment"></div><div><div class="label">Далолатнома <span id="actReq"></span></div><input id="actPhoto" class="file" type="file" accept="image/*,.pdf"></div><div><div class="label">Қўшимча файл</div><input id="extra" class="file" type="file"></div><div><div class="label">Ҳужжат</div><input id="doc" class="file" type="file" accept="image/*,.pdf,.doc,.docx"></div></div><div class="actions"><button id="save" class="secondary">Сақлаш</button><button id="send" class="success">Раҳбарга юбориш</button><button id="clear" class="danger">Тозалаш</button></div><div id="fm"></div>';$('#active').onchange=()=>{const z=$('#active').value==='0';$('#netReq').textContent=z?'*':'';$('#actReq').textContent=z?'*':''};$('#save').onclick=()=>submit('DRAFT');$('#send').onclick=()=>submit('SUBMITTED');$('#clear').onclick=()=>{f.querySelectorAll('input,textarea').forEach(x=>{if(x.type==='file')x.value='';else x.value=''});f.querySelectorAll('select').forEach(x=>x.selectedIndex=0)};$('#active').dispatchEvent(new Event('change'))}async function fileObj(input,role){const files=[...(input?.files||[])];return Promise.all(files.map(file=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({name:file.name,type:file.type,data:r.result,role});r.onerror=no;r.readAsDataURL(file)})))}async function submit(status){const cid=+(S.selected.consumer_id||S.selected.id);try{const files=[];for(const [id,role] of [['sealPhoto','seal'],['meterPhoto','meter'],['readingPhoto','reading'],['gasPhoto','gas'],['netPhoto','network_removed'],['actPhoto','act'],['extra','extra'],['doc','extra']])files.push(...await fileObj($('#'+id),role));const fw={outcome:$('#outcome').value,company_active:$('#active').value,contact_name:$('#contact').value,debt:$('#debt').value,payment:$('#payment').value,meter_count:$('#meterCount').value,meter_type:$('#meterType').value,seal_number:$('#sealNo').value,meter_state:$('#meterState').value,gas_type:$('#gasType').value,standard:$('#standard').value,gost:$('#gost').value,notes:$('#notes').value};if(status==='SUBMITTED'){if(!fw.outcome)throw Error('Натижа мажбурий');if(!$('#sealPhoto').files.length||!$('#meterPhoto').files.length||!$('#readingPhoto').files.length||!$('#gasPhoto').files.length)throw Error('Мажбурий фотоларни тўлиқ юкланг');if(fw.company_active==='0'&&(!$('#netPhoto').files.length||!$('#actPhoto').files.length))throw Error('Фаол эмас корхона учун фото ва далолатнома мажбурий');const g=await gps();S.gps=g;await finishVisit(g,fw.outcome,fw.notes)}const r=await api('/api/employee-entry',{method:'POST',body:JSON.stringify({entry_id:S.entryId,consumer_id:cid,status,fieldwork_data:fw,contact_name:fw.contact_name,order_amount:fw.payment,payment_status:fw.debt,notes:fw.notes,lat:S.gps?.lat,lon:S.gps?.lon,accuracy:S.gps?.accuracy,attachments:files})});S.entryId=r.entry_id;$('#fm').innerHTML='<div class="msg ok">'+(status==='SUBMITTED'?'Маълумот раҳбарга юборилди ✓':'Қоралама сақланди ✓')+'</div>';if(status==='SUBMITTED'){await load();select(cid)}}catch(e){$('#fm').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}async function finishVisit(g,outcome,notes){await api('/api/employee-visit-finish',{method:'POST',body:JSON.stringify({consumer_id:+(S.selected.consumer_id||S.selected.id),lat:g.lat,lon:g.lon,accuracy:g.accuracy,outcome,notes,client_event_id:crypto.randomUUID()})})}boot()})();
</script></body></html>
