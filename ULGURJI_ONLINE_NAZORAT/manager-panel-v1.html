<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>УЛГУРЖИ ОНЛАЙН НАЗОРАТ — Раҳбар панели</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:700}.muted{color:#667085}.danger{background:#d92d20}.secondary{background:#e8eef8;color:#172033}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:16px;box-shadow:0 3px 12px #1018280a}.kpi b{display:block;font-size:28px;margin-top:7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab.active{background:#172033;color:#fff}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{padding:10px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;min-width:180px}.grow{flex:1}.tablewrap{overflow:auto;margin-top:12px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.table th{font-size:12px;color:#667085;background:#f8fafc}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#175cd3;font-size:12px;font-weight:700}.ok{background:#ecfdf3;color:#027a48}.warn{background:#fffaeb;color:#b54708}.modal{position:fixed;inset:0;background:#10182880;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modalbox{width:min(1100px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.empty{text-align:center;padding:35px;color:#667085}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.field{width:100%}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="app"></div><script>(()=>{const $=s=>document.querySelector(s),token=localStorage.getItem('ulgurji_token')||localStorage.getItem('uog_token');if(!token){location.replace('/');return}const api=async(path,opt={})=>{const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d};const state={me:null,employees:[],tab:'employees',q:'',date:new Date().toISOString().slice(0,10)};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){try{state.me=await api('/api/me');if(state.me.role!=='admin'){location.replace('/employee-panel-v5.html');return}await render()}catch(e){localStorage.removeItem('ulgurji_token');localStorage.removeItem('uog_token');location.replace('/')}}async function render(){document.body.innerHTML='<div class="wrap"><div class="top"><div><div class="brand">УЛГУРЖИ ОНЛАЙН НАЗОРАТ</div><small>Раҳбарнинг ягона назорат панели</small></div><div class="row"><span class="badge">'+esc(state.me.name||'Раҳбар')+'</span><button class="danger" id="logout">Чиқиш</button></div></div><div id="body"></div></div>';$('#logout').onclick=()=>{localStorage.removeItem('ulgurji_token');localStorage.removeItem('uog_token');location.replace('/')};await draw()}async function draw(){const b=$('#body');b.innerHTML='<div class="tabs"><button class="tab '+(state.tab==='employees'?'active':'')+'" data-t="employees">Ходимлар</button><button class="tab '+(state.tab==='daily'?'active':'')+'" data-t="daily">Кунлик ҳисобот</button><button class="tab '+(state.tab==='monthly'?'active':'')+'" data-t="monthly">Ойлик ҳисобот</button><button class="tab '+(state.tab==='route'?'active':'')+'" data-t="route">Харита / маршрут</button></div><div id="view"></div>';document.querySelectorAll('.tab').forEach(x=>x.onclick=async()=>{state.tab=x.dataset.t;await draw()});if(state.tab==='employees')await employeesView();else if(state.tab==='daily')await dailyView();else if(state.tab==='monthly')await monthlyView();else await routeView()}async function employeesView(){const v=$('#view');let d;try{d=await api('/api/employees')}catch(e){v.innerHTML='<div class="card">Ходимлар маълумотини олишда хато: '+esc(e.message)+'</div>';return}state.employees=Array.isArray(d)?d:(d.rows||d.employees||[]);const rows=state.employees.filter(e=>JSON.stringify(e).toLowerCase().includes(state.q.toLowerCase()));v.innerHTML='<div class="card"><div class="row"><input id="eq" class="field grow" placeholder="Ходимни ID, Ф.И.Ш., ҳудуд ёки туман бўйича қидириш..." value="'+esc(state.q)+'"><button id="allEmployees">Барча ходимларни кўриш</button><button id="refresh">Янгилаш</button></div><div class="notice" style="padding:12px;border-radius:10px;background:#f2f4f7;margin:10px 0">Истеъмолчини ходимга бириктириш раҳбар панелида олиб ташланган. Бу панель фақат ходимлар назорати, кунлик/ойлик ҳисобот ва GPS маршрут учун.</div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Ходим</th><th>Ҳудуд</th><th>Туман</th><th>Лавозим</th><th>Ҳолат</th><th></th></tr></thead><tbody>'+(rows.length?rows.map(e=>'<tr><td>'+esc(e.id||e.employee_id)+'</td><td><b>'+esc(e.employee_name||e.name)+'</b><br><span class="muted">'+esc(e.login||'')+'</span></td><td>'+esc(e.region)+'</td><td>'+esc(e.district)+'</td><td>'+esc(e.position)+'</td><td><span class="badge '+(e.active===false?'warn':'ok')+'">'+(e.active===false?'Фаол эмас':'Фаол')+'</span></td><td><button class="viewEmp" data-id="'+esc(e.id||e.employee_id)+'">Кўриш</button></td></tr>').join(''):'<tr><td colspan="7" class="empty">Ходим топилмади</td></tr>')+'</tbody></table></div></div>';$('#eq').oninput=e=>{state.q=e.target.value;employeesView()};$('#refresh').onclick=employeesView;$('#allEmployees').onclick=()=>{state.q='';employeesView()};document.querySelectorAll('.viewEmp').forEach(x=>x.onclick=()=>employeeDetail(x.dataset.id))}async function employeeDetail(id){const e=state.employees.find(x=>String(x.id||x.employee_id)===String(id))||{};const date=state.date;let d={rows:[]};try{d=await api('/api/today?employee_id='+encodeURIComponent(id)+'&date='+encodeURIComponent(date))}catch(err){}const rows=d.rows||d.result||[];const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modalbox"><div class="modalhead"><div><h2>'+esc(e.employee_name||e.name||id)+'</h2><div class="muted">'+esc(e.region)+' • '+esc(e.district)+' • '+esc(e.position)+'</div></div><button class="secondary" id="close">Ёпиш</button></div><div class="row" style="margin-top:15px"><input id="edate" type="date" class="field" value="'+date+'"><button id="reload">Режани янгилаш</button><button id="route">GPS маршрут</button></div><div class="grid" style="margin-top:12px"><div class="card kpi">Режа<b>'+rows.length+'</b></div><div class="card kpi">Ташриф<b>'+rows.filter(r=>r.ended_server||r.visit_status==='FINISHED').length+'</b></div><div class="card kpi">Қолдиқ<b>'+rows.filter(r=>!(r.ended_server||r.visit_status==='FINISHED')).length+'</b></div><div class="card kpi">Сана<b>'+esc(date)+'</b></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Истеъмолчи</th><th>Манзил</th><th>Ҳолат</th><th>Натижа</th><th>Изоҳ</th></tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr><td>'+esc(r.name||r.consumer_name||r.consumer_id)+'</td><td>'+esc(r.address||'')+'</td><td><span class="badge '+(r.ended_server||r.visit_status==='FINISHED'?'ok':'warn')+'">'+(r.ended_server||r.visit_status==='FINISHED'?'Якунланган':'Режада')+'</span></td><td>'+esc(r.outcome||'—')+'</td><td>'+esc(r.note||r.comment||'—')+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">Бу сана учун маълумот йўқ</td></tr>')+'</tbody></table></div></div>';document.body.appendChild(m);m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#reload').onclick=async()=>{state.date=m.querySelector('#edate').value;m.remove();employeeDetail(id)};m.querySelector('#route').onclick=()=>{m.remove();routeModal(id,state.date)}}async function dailyView(){const v=$('#view');v.innerHTML='<div class="card"><div class="row"><input id="dd" type="date" class="field" value="'+state.date+'"><button id="dl">Юклаш</button></div><div id="dr" class="tablewrap"></div></div>';$('#dl').onclick=load;await load();async function load(){state.date=$('#dd').value;try{const d=await api('/api/report?date='+encodeURIComponent(state.date));const rows=d.rows||[];$('#dr').innerHTML='<table class="table"><thead><tr><th>Ходим</th><th>Ҳудуд</th><th>Туман</th><th>Режа</th><th>Ташриф</th><th>Яроқли</th><th>Шубҳали</th><th>Қолдиқ</th><th>Якуний назорат</th></tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr><td>'+esc(r.employee)+'</td><td>'+esc(r.region)+'</td><td>'+esc(r.district)+'</td><td>'+esc(r.planned)+'</td><td>'+esc(r.visited)+'</td><td>'+esc(r.valid)+'</td><td>'+esc(r.suspicious)+'</td><td>'+esc(r.not_visited)+'</td><td><button class="final" data-id="'+esc(r.employee_id)+'">Кўриш</button></td></tr>').join(''):'<tr><td colspan="9" class="empty">Маълумот йўқ</td></tr>')+'</tbody></table>';document.querySelectorAll('.final').forEach(x=>x.onclick=()=>employeeDetail(x.dataset.id))}catch(e){$('#dr').innerHTML='<div class="empty">Ҳисоботни юклашда хато: '+esc(e.message)+'</div>'}}}async function monthlyView(){const v=$('#view'),m=state.date.slice(0,7);v.innerHTML='<div class="card"><div class="row"><input id="mm" type="month" class="field" value="'+m+'"><button id="ml">Юклаш</button></div><div id="mr" class="tablewrap"></div></div>';$('#ml').onclick=load;await load();async function load(){try{const d=await api('/api/monthly?month='+encodeURIComponent($('#mm').value));const rows=d.rows||d.result||[];$('#mr').innerHTML='<table class="table"><thead><tr><th>Ходим</th><th>Ҳудуд</th><th>Туман</th><th>Режа</th><th>Ташриф</th><th>Яроқли</th><th>Шубҳали</th><th>Қолдиқ</th><th>%</th></tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr><td>'+esc(r.employee)+'</td><td>'+esc(r.region)+'</td><td>'+esc(r.district)+'</td><td>'+esc(r.planned)+'</td><td>'+esc(r.visited)+'</td><td>'+esc(r.valid)+'</td><td>'+esc(r.suspicious)+'</td><td>'+esc(r.not_visited)+'</td><td>'+esc(r.completion)+'%</td></tr>').join(''):'<tr><td colspan="9" class="empty">Маълумот йўқ</td></tr>')+'</tbody></table>'}catch(e){$('#mr').innerHTML='<div class="empty">Ойлик ҳисоботни юклашда хато: '+esc(e.message)+'</div>'}}}async function routeView(){const v=$('#view');v.innerHTML='<div class="card"><h2>Харита / маршрут</h2><p class="muted">Харита ҳисоботга ўтказмайди. GPS маршрут алоҳида очилади.</p><div class="row"><select id="re" class="field"><option value="">Ходимни танланг</option>'+state.employees.map(e=>'<option value="'+esc(e.id||e.employee_id)+'">'+esc(e.employee_name||e.name)+'</option>').join('')+'</select><input id="rd" type="date" class="field" value="'+state.date+'"><button id="rv">Маршрутни кўриш</button></div></div>';$('#rv').onclick=()=>{if(!$('#re').value)return alert('Ходимни танланг');routeModal($('#re').value,$('#rd').value)}}async function routeModal(eid,date){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modalbox"><div class="modalhead"><h2>GPS маршрут</h2><button class="secondary" id="x">Ёпиш</button></div><div id="rr" class="empty">Юкланмоқда...</div></div>';document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();try{const d=await api('/api/route?employee_id='+encodeURIComponent(eid)+'&date='+encodeURIComponent(date));const pts=d.points||[],vis=d.visits||[];m.querySelector('#rr').innerHTML='<div class="grid"><div class="card kpi">GPS нуқта<b>'+pts.length+'</b></div><div class="card kpi">Ташриф<b>'+vis.length+'</b></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Вақт</th><th>Latitude</th><th>Longitude</th><th>Тури</th></tr></thead><tbody>'+pts.map(p=>'<tr><td>'+esc(p.created_server||p.created_at||p.time)+'</td><td>'+esc(p.lat)+'</td><td>'+esc(p.lon)+'</td><td>'+esc(p.type||'GPS')+'</td></tr>').join('')+'</tbody></table></div>'}catch(e){m.querySelector('#rr').textContent='Маршрутни олишда хато: '+esc(e.message)}}boot()})();</script></body></html>
