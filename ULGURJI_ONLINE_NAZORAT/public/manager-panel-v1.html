<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>УЛГУРЖИ ОНЛАЙН НАЗОРАТ — Раҳбар панели</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:700}.secondary{background:#e8eef8;color:#172033}.danger{background:#d92d20}.muted{color:#667085}.wrap{max-width:1500px;margin:auto;padding:18px}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-size:22px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab.active{background:#172033}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:16px;box-shadow:0 3px 12px #1018280a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{display:block;font-size:28px;margin-top:7px}.field{padding:10px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;min-width:180px}.grow{flex:1}.tablewrap{overflow:auto;margin-top:12px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top}.table th{font-size:12px;color:#667085;background:#f8fafc}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef4ff;color:#175cd3}.ok{background:#ecfdf3;color:#027a48}.bad{background:#fef3f2;color:#b42318}.warn{background:#fffaeb;color:#b54708}.modal{position:fixed;inset:0;background:#10182880;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{width:min(1200px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.detailgrid>div{background:#f8fafc;padding:10px;border-radius:10px}.detailgrid b,.detailgrid span{display:block}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.photo-link{display:inline-block;padding:6px 9px;border-radius:8px;background:#eef4ff;color:#175cd3;text-decoration:none}.route-map{height:430px;border-radius:12px;margin:12px 0}.empty{text-align:center;padding:30px;color:#667085}@media(max-width:900px){.grid,.detailgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.detailgrid{grid-template-columns:1fr}.field{width:100%}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">УЛГУРЖИ ОНЛАЙН НАЗОРАТ</div><small>Раҳбарнинг ягона назорат панели • GPS • ташриф • хатлов • назорат</small></div><button class="danger" id="logout">Чиқиш</button></div><div id="app"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{const token=localStorage.getItem('uog_token')||localStorage.getItem('ulgurji_token'),$=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if(!token){location.replace('/');return}const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(o.headers||{})},cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||('HTTP '+r.status));return d};const st={employees:[],tab:'employees',q:'',date:today(),month:today().slice(0,7)};function shell(h,rows){return '<div class="tablewrap"><table class="table"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+h.length+'" class="empty">Маълумот йўқ</td></tr>')+'</tbody></table></div>'}async function boot(){try{const me=await api('/api/me');if(me.role!=='admin')return location.replace('/');await draw()}catch(e){localStorage.removeItem('uog_token');localStorage.removeItem('ulgurji_token');location.replace('/')}}async function draw(){const a=$('#app');a.innerHTML='<div class="tabs"><button class="tab '+(st.tab==='employees'?'active':'')+'" data-t="employees">Ходимлар</button><button class="tab '+(st.tab==='daily'?'active':'')+'" data-t="daily">Кунлик ҳисобот</button><button class="tab '+(st.tab==='monthly'?'active':'')+'" data-t="monthly">Ойлик ҳисобот</button><button class="tab '+(st.tab==='route'?'active':'')+'" data-t="route">Харита / маршрут</button></div><div id="view"></div>';document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{st.tab=b.dataset.t;await draw()});if(st.tab==='employees')await employees();if(st.tab==='daily')await daily();if(st.tab==='monthly')await monthly();if(st.tab==='route')await routePage()}async function employees(){const v=$('#view');try{const d=await api('/api/employees');st.employees=Array.isArray(d)?d:(d.rows||d.employees||[])}catch(e){return v.innerHTML='<div class="card bad">Ходимлар юкланмади: '+esc(e.message)+'</div>'}const rows=st.employees.filter(e=>JSON.stringify(e).toLowerCase().includes(st.q.toLowerCase()));v.innerHTML='<div class="card"><div class="row"><input id="eq" class="field grow" placeholder="ID, Ф.И.Ш., ҳудуд ёки туман бўйича қидириш..." value="'+esc(st.q)+'"><button id="all">Барча ходимларни кўриш</button><button id="ref">Янгилаш</button></div><p class="muted">Истеъмолчини ходимга бириктириш йўқ. Назорат ҳудуд (вилоят → туман/шаҳар) асосида ишлайди.</p>'+shell(['ID','Ходим','Вилоят','Туман/шаҳар','Лавозим','Ҳолат','Назорат'],rows.map(e=>'<tr><td>'+esc(e.id||e.employee_id)+'</td><td><b>'+esc(e.employee_name||e.name)+'</b></td><td>'+esc(e.region||'—')+'</td><td>'+esc(e.district||'—')+'</td><td>'+esc(e.position||'—')+'</td><td><span class="badge '+(e.active===false?'warn':'ok')+'">'+(e.active===false?'Фаол эмас':'Фаол')+'</span></td><td><button class="view" data-id="'+esc(e.id||e.employee_id)+'">Кўриш</button></td></tr>').join(''))+'</div>';$('eq').oninput=e=>{st.q=e.target.value;employees()};$('all').onclick=()=>{st.q='';employees()};$('ref').onclick=employees;document.querySelectorAll('.view').forEach(b=>b.onclick=()=>employeeDetail(b.dataset.id))}async function employeeDetail(id){const e=st.employees.find(x=>String(x.id||x.employee_id)===String(id))||{},date=st.date;let d={rows:[]},ed={items:[]};try{d=await api('/api/today?employee_id='+encodeURIComponent(id)+'&date='+encodeURIComponent(date));ed=await api('/api/manager-employee-entries?employee_id='+encodeURIComponent(id)+'&date='+encodeURIComponent(date))}catch(err){}const rows=d.rows||d.items||[],entries=ed.items||[],byVisit=new Map(entries.filter(x=>x.visit_id).map(x=>[String(x.visit_id),x]));const entered=rows.filter(r=>String(r.entry_status||'')==='КИРДИ'),missing=rows.filter(r=>String(r.entry_status||'')!=='КИРДИ');const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modalbox"><div class="modalhead"><div><h2>'+esc(e.employee_name||e.name||d.employee||id)+'</h2><div class="muted">'+esc(e.region||d.region||'—')+' • '+esc(e.district||d.district||'—')+' • '+esc(e.position||'')+'</div></div><button class="secondary" id="close">Ёпиш</button></div><div class="row" style="margin:12px 0"><input id="date" type="date" class="field" value="'+esc(date)+'"><button id="reload">Янгилаш</button><button id="route">GPS маршрут</button></div><div class="grid"><div class="card kpi">Режа<b>'+rows.length+'</b></div><div class="card kpi">КИРДИ<b class="ok">'+entered.length+'</b></div><div class="card kpi">КИРМАДИ<b class="bad">'+missing.length+'</b></div><div class="card kpi">Бажарилиш<b>'+(rows.length?Math.round(entered.length/rows.length*100):0)+'%</b></div></div>'+shell(['Истеъмолчи','Манзил','Ҳолат','Кириш','Чиқиш','Натижа','Изоҳ','Далил'],rows.map(r=>{const en=byVisit.get(String(r.visit_id));const fs=en?.files||[];return '<tr><td><b>'+esc(r.name||r.consumer_name||r.consumer_id)+'</b><br><span class="muted">ID '+esc(r.consumer_id||r.id)+'</span></td><td>'+esc([r.region||'',r.district||'',r.mahalla||'',r.street||''].filter(Boolean).join(' • '))+'</td><td><span class="badge '+(r.entry_status==='КИРДИ'?'ok':'bad')+'">'+(r.entry_status||'КИРМАДИ')+'</span>'+(r.survey_status?'<br><small>Хатлов: '+esc(r.survey_status)+'</small>':'')+'</td><td>'+esc(r.started_server||'—')+'<br><small>GPS '+esc(r.start_lat??'—')+', '+esc(r.start_lon??'—')+'</small></td><td>'+esc(r.ended_server||'—')+'</td><td>'+esc(r.outcome||'—')+'</td><td>'+esc(r.notes||'—')+'</td><td>'+(fs.length?'<div class="photos">'+fs.map(f=>'<a class="photo-link" target="_blank" href="/api/manager-employee-entry-files/'+f.id+'">📎 '+esc(f.filename)+'</a>').join('')+'</div>':'—')+'</td></tr>'}).join(''))+'</div>';document.body.appendChild(m);m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#reload').onclick=()=>{st.date=m.querySelector('#date').value;m.remove();employeeDetail(id)};m.querySelector('#route').onclick=()=>{m.remove();routeModal(id,st.date)}}async function daily(){const v=$('#view');v.innerHTML='<div class="card"><div class="row"><input id="d" type="date" class="field" value="'+esc(st.date)+'"><button id="load">Юклаш</button></div><div id="r"></div></div>';async function load(){st.date=$('#d').value;try{const d=await api('/api/report?date='+encodeURIComponent(st.date)),rows=d.result||d.rows||[];$('#r').innerHTML=shell(['Ходим','Ҳудуд','Туман/шаҳар','Режа','КИРДИ','КИРМАДИ','Шубҳали','%','Якуний назорат'],rows.map(x=>'<tr><td><b>'+esc(x.employee||x.employee_name)+'</b></td><td>'+esc(x.region||'—')+'</td><td>'+esc(x.district||'—')+'</td><td>'+esc(x.planned)+'</td><td class="ok"><b>'+esc(x.visited)+'</b></td><td class="bad"><b>'+esc(x.not_visited)+'</b></td><td>'+esc(x.suspicious)+'</td><td>'+esc(x.completion)+'%</td><td><button class="final" data-id="'+esc(x.employee_id)+'">Кўриш</button></td></tr>').join(''));document.querySelectorAll('.final').forEach(b=>b.onclick=()=>employeeDetail(b.dataset.id))}catch(e){$('#r').innerHTML='<div class="bad">Кунлик ҳисобот хато: '+esc(e.message)+'</div>'}}$('#load').onclick=load;await load()}async function monthly(){const v=$('#view');v.innerHTML='<div class="card"><div class="row"><input id="m" type="month" class="field" value="'+esc(st.month)+'"><button id="load">Юклаш</button></div><div id="r"></div></div>';async function load(){st.month=$('#m').value;try{const d=await api('/api/monthly?month='+encodeURIComponent(st.month)),rows=d.result||d.rows||[];$('#r').innerHTML=shell(['Ходим','Вилоят','Туман/шаҳар','Режа','КИРДИ','КИРМАДИ','Яроқли','Шубҳали','%'],rows.map(x=>'<tr><td>'+esc(x.employee||x.employee_name)+'</td><td>'+esc(x.region||'—')+'</td><td>'+esc(x.district||'—')+'</td><td>'+esc(x.planned)+'</td><td class="ok"><b>'+esc(x.visited)+'</b></td><td class="bad"><b>'+esc(x.not_visited)+'</b></td><td>'+esc(x.valid)+'</td><td>'+esc(x.suspicious)+'</td><td>'+esc(x.completion)+'%</td></tr>').join(''))}catch(e){$('#r').innerHTML='<div class="bad">Ойлик ҳисобот хато: '+esc(e.message)+'</div>'}}$('#load').onclick=load;await load()}async function routePage(){const v=$('#view');if(!st.employees.length)try{const d=await api('/api/employees');st.employees=Array.isArray(d)?d:(d.rows||d.employees||[])}catch{}v.innerHTML='<div class="card"><h2>Харита / маршрут</h2><p class="muted">Харита ҳисоботдан алоҳида. Танланган ходимнинг GPS нуқталари ва ташриф далиллари шу ерда очилади.</p><div class="row"><select id="e" class="field"><option value="">Ходимни танланг</option>'+st.employees.map(e=>'<option value="'+esc(e.id||e.employee_id)+'">'+esc(e.employee_name||e.name)+'</option>').join('')+'</select><input id="d" type="date" class="field" value="'+esc(st.date)+'"><button id="go">Маршрутни кўриш</button></div></div>';$('#go').onclick=()=>{$('#e').value?routeModal($('#e').value,$('#d').value):alert('Ходимни танланг')}}async function routeModal(eid,date){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modalbox"><div class="modalhead"><h2>GPS маршрут ва ташрифлар</h2><button class="secondary" id="x">Ёпиш</button></div><div id="rr" class="empty">Юкланмоқда...</div></div>';document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();try{const [d,ed]=await Promise.all([api('/api/route?employee_id='+encodeURIComponent(eid)+'&date='+encodeURIComponent(date)),api('/api/manager-employee-entries?employee_id='+encodeURIComponent(eid)+'&date='+encodeURIComponent(date))]);const pts=d.points||d.gps||[],vis=d.visits||[],entries=ed.items||[],byVisit=new Map(entries.filter(x=>x.visit_id).map(x=>[String(x.visit_id),x]));let mapHtml='<div class="route-map" id="map"></div>';let rows=vis.map(v=>{const en=byVisit.get(String(v.id||v.visit_id)),fs=en?.files||[];return '<tr class="visitRow" data-visit="'+esc(v.id||v.visit_id)+'"><td><b>'+esc(v.name||v.consumer_name||v.consumer_id)+'</b></td><td>'+esc(v.started_server||v.start_time||'—')+'</td><td>'+esc(v.ended_server||v.end_time||'—')+'</td><td>'+esc(v.start_lat??v.lat??'—')+', '+esc(v.start_lon??v.lon??'—')+'</td><td>'+esc(v.outcome||'—')+'</td><td><span class="badge '+(String(v.status||'').toUpperCase().includes('FIN')?'ok':'warn')+'">'+esc(v.status||'—')+'</span></td><td>'+(fs.length?fs.map(f=>'<a class="photo-link" target="_blank" href="/api/manager-employee-entry-files/'+f.id+'">📎 '+esc(f.filename)+'</a>').join(' '):'—')+'</td></tr>'}).join('');m.querySelector('#rr').innerHTML='<div class="grid"><div class="card kpi">GPS нуқта<b>'+pts.length+'</b></div><div class="card kpi">Ташриф<b>'+vis.length+'</b></div><div class="card kpi">Далилли хатлов<b>'+entries.length+'</b></div><div class="card kpi">Сана<b>'+esc(date)+'</b></div></div>'+mapHtml+shell(['Истеъмолчи','Кириш','Чиқиш','GPS','Натижа','Ҳолат','Фото/ҳужжат'],rows);if(window.L&&pts.length){const mp=L.map('map').setView([+pts[0].lat,+pts[0].lon],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mp);const line=pts.filter(p=>Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)).map(p=>[+p.lat,+p.lon]);if(line.length>1){L.polyline(line).addTo(mp);mp.fitBounds(line,{padding:[20,20]})}vis.forEach(v=>{const lat=+(v.start_lat??v.lat),lon=+(v.start_lon??v.lon);if(Number.isFinite(lat)&&Number.isFinite(lon))L.marker([lat,lon]).addTo(mp).bindPopup('<b>'+esc(v.name||v.consumer_name||'Истеъмолчи')+'</b><br>Кириш: '+esc(v.started_server||'—')+'<br>Чиқиш: '+esc(v.ended_server||'—')+'<br>Натижа: '+esc(v.outcome||'—')+'<br>GPS: '+lat+', '+lon)});document.querySelectorAll('.visitRow').forEach(r=>r.onclick=()=>{const vv=vis.find(x=>String(x.id||x.visit_id)===r.dataset.visit);if(vv){const lat=+(vv.start_lat??vv.lat),lon=+(vv.start_lon??vv.lon);if(Number.isFinite(lat)&&Number.isFinite(lon))mp.setView([lat,lon],17)}})}}catch(e){m.querySelector('#rr').innerHTML='<div class="bad">Маршрутни олишда хато: '+esc(e.message)+'</div>'}}$('#logout').onclick=()=>{localStorage.removeItem('uog_token');localStorage.removeItem('ulgurji_token');location.replace('/')};boot()})();</script></body></html>
